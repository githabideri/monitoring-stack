# monitoring-stack example inventory.
# Copy into your private repo, replace placeholders, and point the
# site playbook's ANSIBLE_INVENTORY at it.
#
# The "site" label value (and any other topology labels) is site data —
# it never belongs in the public repo.

[prometheus_servers]
prometheus.example.lan ansible_host=10.0.0.10

[grafana_servers]
grafana.example.lan ansible_host=10.0.0.11

# Any host that runs node_exporter (PVE hosts, SBCs, LXCs, ...)
[node_exporter_servers]
pve1.example.lan  ansible_host=10.0.0.1
pve2.example.lan  ansible_host=10.0.0.2
sbcrpi.example.lan ansible_host=10.0.0.3

[all:vars]
ansible_user=admin
ansible_python_interpreter=/usr/bin/python3

# ---- prometheus_servers vars -------------------------------------------
[prometheus_servers:vars]
# Site label applied to every series (external_labels)
prometheus_external_labels:
  site: vienna
# TSDB on a dedicated ZFS-backed mountpoint (never the rootfs, never NFS)
prometheus_data_dir: /var/lib/prometheus
prometheus_retention_time: "90d"
prometheus_retention_size: "16GB"

# Scrape jobs. node=1/cluster=1 url params are pve-exporter's way of
# selecting node vs cluster metric sets (cluster metrics only from ONE node).
prometheus_scrape_configs:
  - job: node-exporter
    targets:
      - "10.0.0.1:9100"
      - "10.0.0.2:9100"
    labels: { role: host }
  - job: pve-exporter-node
    targets: ["127.0.0.1:9221"]
    params: { node: ["1"] }
    labels: { role: pve-node }
  - job: pve-exporter-cluster
    targets: ["127.0.0.1:9221"]
    params: { cluster: ["1"] }
    labels: { role: pve-cluster }
  - job: pbs-exporter
    targets: ["127.0.0.1:10019"]
    labels: { role: pbs }
  # LLM endpoints (hub /metrics, vLLM, llama.cpp) — add as available
  - job: llm-hub
    targets: ["10.0.0.20:8443"]
    scheme: https
    tls_insecure_skip_verify: true
    labels: { role: llm-hub }

# Rule files (paths on the control node), e.g. the repo's rules dir
prometheus_rule_files:
  - /path/to/monitoring-stack/prometheus/rules/homelab.rules.yml

# pve-exporter: READ-ONLY PVE credentials (PVEAuditor per host)
pve_exporter_servers:
  default:
    user: "monitoring@pve"
    token_name: "scraper"
    token_value: "CHANGE-ME"
  pve1: { url: "10.0.0.1" }
  pve2: { url: "10.0.0.2" }

# pbs-exporter: READ-ONLY PBS API token
pbs_exporter_endpoint: "https://10.0.0.5:8007"
pbs_exporter_api_token: "CHANGE-ME"

# ---- grafana_servers vars ----------------------------------------------
[grafana_servers:vars]
grafana_prometheus_url: "http://10.0.0.10:9090"
# Behind a reverse proxy (NPM): the canonical EXTERNAL url, no port.
# Leave out (or empty) for direct-access installs.
grafana_root_url: "https://grafana-ui.example.lan/"
grafana_admin_password: "CHANGE-ME"
grafana_dashboard_files:
  - /path/to/monitoring-stack/grafana/dashboards/homelab-overview.json
  - /path/to/monitoring-stack/grafana/dashboards/host-detail.json
  - /path/to/monitoring-stack/grafana/dashboards/storage-zfs.json
  - /path/to/monitoring-stack/grafana/dashboards/gpu-llm.json

# ---- node_exporter_servers vars ----------------------------------------
[node_exporter_servers:vars]
node_exporter_extra_collectors: [zfs]
