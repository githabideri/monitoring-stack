---
- name: Ensure node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download release tarball
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"
  register: ne_download
  until: not ne_download.failed
  retries: 3
  delay: 10

- name: Verify checksum (if provided)
  ansible.builtin.command: sha256sum /tmp/node_exporter-{{ node_exporter_version }}.tar.gz
  when: node_exporter_download_sha256 | length > 0
  register: ne_sum
  changed_when: false

- name: Fail on checksum mismatch
  ansible.builtin.fail:
    msg: "node_exporter tarball checksum mismatch"
  when: >-
    node_exporter_download_sha256 | length > 0
    and (ne_sum.stdout | default(''))[:64] != node_exporter_download_sha256

- name: Extract
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: "/tmp/ne-extract"
    remote_src: true

- name: Install binary
  ansible.builtin.copy:
    src: "/tmp/ne-extract/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"
  notify: restart node_exporter

- name: Deploy systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: restart node_exporter

- name: Enable and start
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
