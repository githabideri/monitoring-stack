---
- name: Fail if API token not provided
  ansible.builtin.fail:
    msg: "pbs_exporter_api_token must be set (site secrets)"
  when: pbs_exporter_api_token | length == 0

- name: Ensure pbs-exporter user
  ansible.builtin.user:
    name: "{{ pbs_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure directories
  ansible.builtin.file:
    path: "{{ pbs_exporter_config_dir }}"
    state: directory
    owner: "{{ pbs_exporter_user }}"
    group: "{{ pbs_exporter_user }}"
    mode: "0750"

- name: Download release tarball
  ansible.builtin.get_url:
    url: "https://github.com/natrontech/pbs-exporter/releases/download/v{{ pbs_exporter_version }}/pbs-exporter_v{{ pbs_exporter_version }}_linux_{{ pbs_exporter_arch }}.tar.gz"
    dest: "/tmp/pbs-exporter.tar.gz"
    mode: "0644"
  register: pbs_download
  until: not pbs_download.failed
  retries: 3
  delay: 10

- name: Verify checksum (if provided)
  ansible.builtin.command: sha256sum /tmp/pbs-exporter.tar.gz
  when: pbs_exporter_download_sha256 | length > 0
  register: pbs_sum
  changed_when: false

- name: Fail on checksum mismatch
  ansible.builtin.fail:
    msg: "pbs-exporter tarball checksum mismatch"
  when: >-
    pbs_exporter_download_sha256 | length > 0
    and (pbs_sum.stdout | default(''))[:64] != pbs_exporter_download_sha256

- name: Ensure extract dir
  ansible.builtin.file:
    path: /tmp/pbs-extract
    state: directory

- name: Extract
  ansible.builtin.unarchive:
    src: /tmp/pbs-exporter.tar.gz
    dest: "/tmp/pbs-extract"
    remote_src: true

- name: Install binary
  ansible.builtin.copy:
    src: /tmp/pbs-extract/pbs-exporter-linux-{{ pbs_exporter_arch }}
    dest: "{{ pbs_exporter_install_dir }}/pbs-exporter"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: restart pbs_exporter

- name: Deploy env file (token stays out of committed files)
  ansible.builtin.template:
    src: pbs-exporter.env.j2
    dest: "{{ pbs_exporter_config_dir }}/pbs-exporter.env"
    owner: "{{ pbs_exporter_user }}"
    group: "{{ pbs_exporter_user }}"
    mode: "0600"
  notify: restart pbs_exporter

- name: Deploy systemd unit
  ansible.builtin.template:
    src: pbs_exporter.service.j2
    dest: /etc/systemd/system/pbs_exporter.service
    mode: "0644"
  notify: restart pbs_exporter

- name: Enable and start
  ansible.builtin.systemd:
    name: pbs_exporter
    state: started
    enabled: true

# --- pbs-up-probe: pbs_api_up (the exporter's pbs_up probes /nodes, which a
# read-only DatastoreAudit token gets 403 on in PBS 3.x — false negative since
# day one; this probe uses /api2/json/version instead) ---
- name: Ensure pbs-up-probe install dir
  ansible.builtin.file:
    path: /opt/pbs-up-probe
    state: directory
    owner: "{{ pbs_exporter_user }}"
    group: "{{ pbs_exporter_user }}"
    mode: "0755"

- name: Deploy pbs-up-probe script
  ansible.builtin.copy:
    src: pbs_up_probe.py
    dest: /opt/pbs-up-probe/pbs_up_probe.py
    owner: "{{ pbs_exporter_user }}"
    group: "{{ pbs_exporter_user }}"
    mode: "0755"
  notify: restart pbs_up_probe

- name: Deploy pbs-up-probe systemd unit
  ansible.builtin.copy:
    src: pbs_up_probe.service
    dest: /etc/systemd/system/pbs_up_probe.service
    mode: "0644"
  notify: restart pbs_up_probe

- name: Enable and start pbs-up-probe
  ansible.builtin.systemd:
    name: pbs_up_probe
    state: started
    enabled: true
