---
- name: Ensure prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0750"
  loop:
    - "{{ prometheus_install_dir }}"
    - "{{ prometheus_data_dir }}"
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules.d"

- name: Download release tarball
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"
  register: prometheus_download
  until: not prometheus_download.failed
  retries: 3
  delay: 10

- name: Verify checksum (if provided)
  ansible.builtin.command: sha256sum /tmp/prometheus-{{ prometheus_version }}.tar.gz
  when: prometheus_download_sha256 | length > 0
  register: prometheus_sum
  changed_when: false

- name: Fail on checksum mismatch
  ansible.builtin.fail:
    msg: "prometheus tarball checksum mismatch"
  when: >-
    prometheus_download_sha256 | length > 0
    and (prometheus_sum.stdout | default(''))[:64] != prometheus_download_sha256

- name: Extract
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: "/tmp/prometheus-extract"
    remote_src: true
  register: prometheus_unarchive

- name: Install binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-extract/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/{{ item }}"
    dest: "{{ prometheus_install_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: restart prometheus

- name: Deploy main config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0640"
  notify: restart prometheus

- name: Deploy rule files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_config_dir }}/rules.d/"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0640"
  loop: "{{ prometheus_rule_files }}"
  notify: restart prometheus

- name: Deploy systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: restart prometheus

- name: Enable and start
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
