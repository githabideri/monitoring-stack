---
- name: Ensure prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true
  when: prometheus_user != 'root'

- name: Ensure prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: prometheus_user != 'root'

# NOTE: for LXC deployments set prometheus_user: root in the site inventory
# (unprivileged CT is the security boundary; external ZFS mounts can't be
# chowned by the CT user). For bare-metal/VM deployments keep the dedicated
# user (default).
# Scope of tolerance: install/config dirs are strict; only the data dir may
# be an external ZFS mount the service user can't chown from inside an
# unprivileged CT, so only that one is lenient (plus a writability check).
- name: Ensure install and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user if prometheus_user != 'root' else 'root' }}"
    group: "{{ prometheus_group }}"
    mode: "0750"
  loop:
    - "{{ prometheus_install_dir }}"
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules.d"

- name: Ensure data directory (may sit on an external ZFS mount)
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    mode: "0750"
  failed_when: false

- name: Verify data directory is writable by the service user
  ansible.builtin.command: test -w "{{ prometheus_data_dir }}"
  become: true
  become_user: "{{ prometheus_user }}"
  changed_when: false
  register: prometheus_data_dir_writable
  failed_when: false

- name: Fail with a clear message if the data directory is not writable
  ansible.builtin.fail:
    msg: >-
      {{ prometheus_data_dir }} is not writable by {{ prometheus_user }}.
      For an external ZFS mount in an unprivileged CT: run the service as
      root (prometheus_user: root) or chown the dataset from the host:
      zfs set owner={{ prometheus_user }}:{{ prometheus_group }} <dataset>
  when: prometheus_data_dir_writable.rc != 0

- name: Download release tarball
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"
  register: prometheus_download
  until: not prometheus_download.failed
  retries: 3
  delay: 10

- name: Verify checksum (if provided)
  ansible.builtin.command: sha256sum /tmp/prometheus-{{ prometheus_version }}.tar.gz
  when: prometheus_download_sha256 | length > 0
  register: prometheus_sum
  changed_when: false

- name: Fail on checksum mismatch
  ansible.builtin.fail:
    msg: "prometheus tarball checksum mismatch"
  when: >-
    prometheus_download_sha256 | length > 0
    and (prometheus_sum.stdout | default(''))[:64] != prometheus_download_sha256

- name: Ensure extract dir
  ansible.builtin.file:
    path: /tmp/prometheus-extract
    state: directory

- name: Extract
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: "/tmp/prometheus-extract"
    remote_src: true
  register: prometheus_unarchive

- name: Install binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-extract/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/{{ item }}"
    dest: "{{ prometheus_install_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify: restart prometheus

- name: Deploy main config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0640"
  notify: restart prometheus

- name: Deploy rule files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_config_dir }}/rules.d/"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0640"
  loop: "{{ prometheus_rule_files }}"
  notify: restart prometheus

- name: Deploy systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: restart prometheus

- name: Enable and start
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
