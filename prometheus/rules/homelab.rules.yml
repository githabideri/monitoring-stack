---
# homelab: recording-rule namespace.
#
# This file is part of the machine-facing interface: local administration
# agents query these names instead of reconstructing multi-term PromQL
# every time (see docs/agent-queries.md).
#
# Rules:
#   - small in number, each one a genuinely useful health concept
#   - stable once published (renames are breaking changes for agents)
#   - naming: homelab:<concept>[:<aggregation>], ratio metrics are 0..1
#   - no alerting rules here (phase 1 has no Alertmanager)

groups:
  - name: homelab.hosts
    interval: 1m
    rules:
      # CPU utilisation, 5-minute smoothed (0..100).
      # rate() over the idle counter = mean idle rate across the window;
      # avg_over_time() on the raw counter would be wrong (monotonic, unbounded).
      - record: homelab:cpu_util:avg5m
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      # Load per core (1.0 == one core fully loaded)
      - record: homelab:load_per_core
        expr: node_load5 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})

      # Memory used ratio (0..1). (If the meminfo collector is absent the
      # rule yields no series for that host — the down-host signal is
      # up{job="node-exporter"}, not a faked 0 here.)
      - record: homelab:mem_used:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

      # Swap used ratio (0..1); 0 on hosts without swap. node_exporter omits
      # both Swap metrics entirely when /proc/meminfo has no SwapTotal, which
      # would otherwise yield NaN. The anchor (MemTotal * 0) is a per-host 0
      # carrying the instance labels; `or` substitutes it only where a Swap
      # metric is absent. Hosts without swap then get an explicit 0
      # ("no swap pressure") instead of a NaN or a vanished series.
      - record: homelab:swap_used:ratio
        expr: >-
          (1 - ((node_memory_SwapFree_bytes or (node_memory_MemTotal_bytes * 0))
                / clamp_min(node_memory_SwapTotal_bytes or (node_memory_MemTotal_bytes * 0), 1))
                * ((node_memory_SwapTotal_bytes or (node_memory_MemTotal_bytes * 0)) > 0))
          or (((node_memory_SwapTotal_bytes or (node_memory_MemTotal_bytes * 0)) == 0) * 0)

      # Filesystem used ratio (0..1) on real filesystems. The `and/or` guard
      # drops zero-size pseudo-filesystems (e.g. fuse.lxcfs, size=0), which
      # would otherwise produce NaN; they report 0 instead.
      - record: homelab:fs_used:ratio
        expr: >-
          (1 - (node_filesystem_avail_bytes{fstype!="tmpfs",fstype!~"overlay|squashfs"}
                / node_filesystem_size_bytes{fstype!="tmpfs",fstype!~"overlay|squashfs"}))
          and (node_filesystem_size_bytes{fstype!="tmpfs",fstype!~"overlay|squashfs"} > 0)
          or (node_filesystem_size_bytes{fstype!="tmpfs",fstype!~"overlay|squashfs"} == 0) * 0

      # Filesystem free bytes
      - record: homelab:fs_free:bytes
        expr: node_filesystem_avail_bytes{fstype!="tmpfs",fstype!~"overlay|squashfs"}

  - name: homelab.storage
    rules:
      # ZFS ARC efficiency (0..1); higher is better. From node_exporter's zfs
      # collector — on PVE 9.2 (SPL 2.4) the /proc/spl/kstat/zfs files gain a leading
      # metadata line but the parser skips past it, so all node_zfs_* metrics work.
      # NOTE: metric names are node_zfs_* (the zfs_exporter-style zfs_* never match),
      # and pool-level node_zpool_* do NOT exist on PVE's SPL (no /proc/spl/.../zpool_*/io)
      # — pool usage is covered by homelab:fs_used:ratio on the dataset filesystems.
      # On an idle interval both rates are 0 and no meaningful ratio exists:
      # the `and` gate makes the rule EMIT NO SAMPLE (absence = no observation,
      # per the machine-facing semantics; an explicit 0 still means a measured
      # 0% hit rate during real activity).
      - record: homelab:zfs_arc_hit:ratio
        expr: >-
          (rate(node_zfs_arc_hits[5m])
           / (rate(node_zfs_arc_hits[5m]) + rate(node_zfs_arc_misses[5m])))
          and (rate(node_zfs_arc_hits[5m]) + rate(node_zfs_arc_misses[5m]) > 0)

  - name: homelab.pbs
    rules:
      # PBS datastore used ratio (0..1)
      - record: homelab:pbs_datastore_used:ratio
        expr: pbs_used / pbs_size

      # Age of the last backup per guest, in seconds.
      # Stale-backup detection: homelab:backup_age_seconds > 2*86400
      - record: homelab:backup_age_seconds
        expr: time() - pbs_snapshot_vm_last_timestamp

      # Verify status of the last backup per guest (1 = verified, 0 = not)
      - record: homelab:backup_verified
        expr: pbs_snapshot_vm_last_verify

  - name: homelab.llm
    rules:
      # KV-cache usage per model (0..1)
      - record: homelab:llm_kv_used:ratio
        expr: avg by (server, model) (hub_model_kv_cache_used)

      # Queue pressure: waiting requests per model. Covers both engines via
      # `or` (vLLM: requests_waiting, llama.cpp: requests_deferred) so the name
      # stays stable no matter which engine serves a model.
      - record: homelab:llm_queue:sum
        expr: sum by (server, model) (hub_model_requests_waiting or hub_model_requests_deferred)

      # Generation throughput per model (tokens/s)
      - record: homelab:llm_tokens_per_second
        expr: avg by (server, model) (hub_model_tokens_per_second)

      # GPU utilisation per physical GPU (0..100)
      - record: homelab:gpu_utilization
        expr: avg by (server, gpu) (hub_gpu_utilization_pct)

      # Prefix/prompt-cache hit ratio (0..1). vLLM: prefix_cache_hit, llama.cpp:
      # prompt_cache_hit — `or` keeps one stable name across engines.
      - record: homelab:llm_prefix_cache_hit:ratio
        expr: avg by (server, model) (hub_model_prefix_cache_hit or hub_model_prompt_cache_hit)

  - name: homelab.services
    rules:
      # Target up state — the canonical availability check for agents.
      # (Prometheus' built-in `up` is the source; this recording rule
      # gives a stable name that is not affected by job renames.)
      - record: homelab:service_up
        expr: up
